services:
  # 1. Database Service (MongoDB)
  database:
    image: mongo:6.0-jammy
    container_name: techphone_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - techphone_network

  # 2. Backend Service (Node.js Express API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techphone_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://database:27017/ecommerce
      - JWT_SECRET=techphone_super_secret_jwt_key_2026
      - JWT_EXPIRE=7d
      - NODE_ENV=production
      - ALLOWED_ORIGIN=http://localhost
    volumes:
      - backend_uploads:/usr/src/app/uploads
    depends_on:
      - database
    restart: unless-stopped
    networks:
      - techphone_network

  # 3. Frontend Service (React SPA served by Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-364103015365-aptr9re4vpvh22e8atf7h2dgs9on07ie.apps.googleusercontent.com}
    container_name: techphone_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - techphone_network

volumes:
  mongo_data:
  backend_uploads:

networks:
  techphone_network:
    driver: bridge
